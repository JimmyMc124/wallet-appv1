name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp Wallet.html www/index.html

      - name: Create Android project and add camera permission
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" /><application|' android/app/src/main/AndroidManifest.xml

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Generate Wallet App Icons
        run: |
          test -f assets/icon.png || (echo "ERROR: assets/icon.png is missing!" && exit 1)
          npx capacitor-assets generate --android

      - name: Sync web files and icons into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
